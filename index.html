<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#701b2b" />
  <meta name="description" content="Holiday Advent Calendar 2026 — Three chapters, one magical holiday journey to Mount Julefest." />
  <title>Advent Calendar 2026 · The Holiday Express</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/JulefestMountainScene.webp" as="image" />
  <link rel="stylesheet" href="styles.css?v=mountain-scene-3" />
  <script src="script.js?v=mountain-scene-3" defer></script>
</head>
<body>
  <main class="experience" aria-label="Holiday Advent Calendar 2026">
    <div class="scene-card">
      <div class="mountain-scene" id="mountainScene" aria-label="Illustrated snowy mountain with three chapters and a holiday train">
        <div class="aurora-glow" aria-hidden="true"></div>
        <!-- Distant Santa flies from right to left across the upper sky. -->
        <div class="santa-flight" aria-hidden="true">
          <img class="santa-render" src="assets/SantaSleigh.png" alt="" decoding="async" />
        </div>
        <h1 class="scene-title">Advent Calendar</h1>
        <img class="scene-art" src="assets/JulefestMountainScene.webp" width="1080" height="1920" alt="Illustrated snowy mountain with pine trees, a frozen pond, and a decorated holiday tree at the summit." />
        <div class="star-glow" aria-hidden="true"></div>
        <canvas id="snowCanvas" class="snow-canvas" aria-hidden="true"></canvas>
        <canvas id="trainCanvas" class="train-canvas" aria-hidden="true"></canvas>
        <button type="button" id="trainHotspot" class="train-hotspot" aria-label="Open Chapter 1 by boarding the Holiday Express" title="Board the Holiday Express"></button>
        <button class="chapter-plaque week-one" type="button" data-chapter="1" data-state="available" aria-label="Week 1, open Chapter 1">
          <span class="chapter-marker" aria-hidden="true"></span>Week 1
        </button>
        <button class="chapter-plaque week-two" type="button" data-chapter="2" data-state="locked" aria-label="Week 2, coming soon">
          <span class="chapter-marker" aria-hidden="true"></span>Week 2
        </button>
        <button class="chapter-plaque week-three" type="button" data-chapter="3" data-state="locked" aria-label="Week 3, coming soon">
          <span class="chapter-marker" aria-hidden="true"></span>Week 3
        </button>
        <button id="musicButton" class="control-button music-button scene-music" type="button" aria-label="Sound effects and music" aria-pressed="false">
          <span class="speaker-icon" aria-hidden="true"></span><span class="music-label" aria-hidden="true">Sound off</span>
        </button>
      </div>
    </div>

    <section class="adventure-panel" aria-labelledby="adventureHeading">
      <p class="eyebrow">Holiday Advent Calendar · 2026</p>
      <h2 id="adventureHeading">All aboard the <span>Holiday Express.</span></h2>
      <p class="lead">Three weeks. Three chapters. One magical journey to the top of Mount Julefest.</p>
      <div class="chapter-guide" aria-label="Chapter overview">
        <button class="guide-card" type="button" data-chapter="1" data-state="available">
          <span class="guide-text">
            <span class="guide-week">Week 1</span>
            <strong class="guide-title">The Holiday Express</strong>
            <span class="guide-note">Build your character</span>
          </span>
          <span class="guide-marker" aria-hidden="true"><span class="chapter-marker"></span></span>
        </button>
        <button class="guide-card" type="button" data-chapter="2" data-state="locked">
          <span class="guide-text">
            <span class="guide-week">Week 2</span>
            <strong class="guide-title">Coming soon</strong>
          </span>
          <span class="guide-marker" aria-hidden="true"><span class="chapter-marker"></span></span>
        </button>
        <button class="guide-card" type="button" data-chapter="3" data-state="locked">
          <span class="guide-text">
            <span class="guide-week">Week 3</span>
            <strong class="guide-title">Coming soon</strong>
          </span>
          <span class="guide-marker" aria-hidden="true"><span class="chapter-marker"></span></span>
        </button>
      </div>
    </section>
  </main>

  <div class="chapter-overlay" id="chapterOverlay" hidden>
    <div class="overlay-backdrop" data-close="true"></div>
    <section class="chapter-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogHeading" tabindex="-1">
      <div class="dialog-toolbar">
        <button type="button" id="closeDialog" class="control-button dialog-back" aria-label="Back to the mountain">Back to mountain</button>
        <button id="dialogMusicButton" class="control-button music-button" type="button" aria-label="Sound effects and music" aria-pressed="false">
          <span class="speaker-icon" aria-hidden="true"></span><span class="music-label" aria-hidden="true">Sound off</span>
        </button>
      </div>
      <div class="dialog-inner" id="dialogInner"></div>
    </section>
  </div>
  <audio id="backgroundMusic" src="assets/Jordan's lullaby(1).mp3" loop preload="none"></audio>
</body>
</html>
